# STATUS: active — transcrite mot pour mot de src/data/products.ts (site @ main 008e19e, ticket #49)
#
# Sa place est 9_Assets/zurp.yml dans le dépôt du produit. Tant que le dépôt ne la porte pas, le
# site la lit ici, dans content/products/maelstrom/, au même format et avec le même code de validation
# (src/lib/catalog/read.mjs). Migrer le produit = déplacer ce dossier, tel quel, dans 9_Assets/.
#
# Déduit, donc absent d'ici : le slug (nom du dossier, ou du dépôt, en minuscules → /maelstrom/), le
# lien vers le dépôt (https://github.com/zUrp-Astronomics/maelstrom), et, de la dernière release
# GitHub, la version affichée (son tag, tel quel) et le rang dans sa section (dernière release en
# haut). Le statut, lui, n'est pas déduit : il est écrit ici, et c'est l'humain qui le décide.

name: Maelstrom
tagline: >-
  A cooled APS-C astrocam built around the CCD of a Nikon D40 — for less than the price of a new
  CMOS camera.
slogan: Pull the sky in
category: Camera
section: cameras          # mounts | cameras | gadgets | future
status: wip               # wip | future | released — décidé par l'humain ; une release ne le change pas
basedOn: Cam86 / Cam87

description:
  - >-
    Maelstrom is an APS-C cooled astronomical camera, built around the CCD sensor salvaged from a
    Nikon D40. Based on the Cam86/Cam87 projects, which pioneered the DSLR-sensor-reborn-as-astrocam
    approach.
  - >-
    Active TEC cooling with condensation control, 16-bit ADC path, INDI driver. The only way to get
    an APS-C CCD astrocam for under the price of a new CMOS — cannibalize a 2006 DSLR and do the
    electronics yourself.

poster: maelstrom.webp    # à côté de cette fiche — l'affiche 2.6 (1254 × 1254)
posterAlt: >-
  Maelstrom poster on a worn, chipped cream plate: a colossal armored steel sea serpent coils into a
  churning whirlpool, rows of curved blade-like fins spiralling toward a glowing blue core, in front
  of the full moon, with ice-blue rays and blueprint sketches, above the slogan “Pull the sky in”.
accent: '#04c8fd'         # couleur des rayons de l'affiche
